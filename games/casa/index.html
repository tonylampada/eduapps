<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B2340">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cadê o Gato">
  <title>Cadê o Gato?</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231B2340'/%3E%3Ccircle cx='32' cy='36' r='20' fill='%23F29C4B'/%3E%3Cpath d='M14 30 13 8l14 12zM50 30l1-22-14 12z' fill='%23F29C4B'/%3E%3Cellipse cx='25' cy='34' rx='3' ry='4' fill='%23222'/%3E%3Cellipse cx='39' cy='34' rx='3' ry='4' fill='%23222'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./game.js"></script>
</head>
<body data-phase="start">

<a class="back" href="../../" aria-label="Voltar">←</a>

<main class="app">
  <div id="scene" class="scene" data-room="0">
    <div class="floor"></div>

    <div id="world" class="world">
      <div id="lamp" class="lamp" aria-hidden="true">
        <svg viewBox="0 0 40 120" aria-hidden="true">
          <rect x="19" y="0" width="2" height="96" fill="#2B2B2B"/>
          <path d="M8 112 13 96h14l5 16z" fill="#E9C46A" stroke="#B88A2E" stroke-width="1.5"/>
          <ellipse class="bulb" cx="20" cy="113" rx="5" ry="4" fill="#FFF6C8"/>
        </svg>
      </div>
      <div class="slot" id="slot-0"></div>
      <div class="slot" id="slot-1"></div>
      <div class="slot" id="slot-2"></div>
      <div class="slot" id="slot-3"></div>

      <div id="beam" class="beam" aria-hidden="true"></div>

      <div id="hint" class="hint" aria-hidden="true">
        <div class="eyes"><i></i><i></i></div>
        <svg class="tail" viewBox="0 0 30 40"><path d="M4 38Q2 18 14 12T24 2" fill="none" stroke="#E8893A" stroke-width="6" stroke-linecap="round"/><path d="M19 7 24 2" stroke="#FFF" stroke-width="6" stroke-linecap="round"/></svg>
        <div class="miau">miau!</div>
      </div>

      <div id="cat" class="cat">
        <div class="cat-move">
          <svg class="cat-svg" viewBox="0 0 100 100" aria-hidden="true">
            <g class="cat-tail"><path d="M70 86Q96 84 92 60T80 38" fill="none" stroke="#E8893A" stroke-width="9" stroke-linecap="round"/></g>
            <ellipse cx="50" cy="76" rx="27" ry="21" fill="#F29C4B"/>
            <path d="M36 66q6 4 4 10M52 60q4 6 2 12" fill="none" stroke="#D97A2B" stroke-width="3" stroke-linecap="round"/>
            <ellipse cx="38" cy="95" rx="8" ry="5" fill="#FFE2C2"/>
            <ellipse cx="60" cy="95" rx="8" ry="5" fill="#FFE2C2"/>
            <g class="cat-head">
              <path d="M24 34 22 6l20 14zM76 34l2-28-20 14z" fill="#F29C4B"/>
              <path d="M27 26 26 12l10 8zM73 26l1-14-10 8z" fill="#FFB7A8"/>
              <circle cx="50" cy="38" r="25" fill="#F29C4B"/>
              <path d="M40 16q4 6 0 10M50 14v10M60 16q-4 6 0 10" fill="none" stroke="#D97A2B" stroke-width="3" stroke-linecap="round"/>
              <ellipse cx="50" cy="48" rx="11" ry="8" fill="#FFE2C2"/>
              <g class="cat-eyes"><ellipse cx="39" cy="36" rx="4" ry="5.5" fill="#2B2B2B"/><ellipse cx="61" cy="36" rx="4" ry="5.5" fill="#2B2B2B"/><circle cx="40.5" cy="34" r="1.5" fill="#fff"/><circle cx="62.5" cy="34" r="1.5" fill="#fff"/></g>
              <path d="M47 44h6l-3 3z" fill="#E86A7E"/>
              <path d="M44 50q3 3 6 0q3 3 6 0" fill="none" stroke="#2B2B2B" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M30 46 16 43M30 50l-14 2M70 46l14-3M70 50l14 2" stroke="#7A4A20" stroke-width="1.2" stroke-linecap="round"/>
            </g>
          </svg>
          <div class="hearts">♥ ♥ ♥</div>
        </div>
      </div>
    </div>

    <p id="bubble" class="bubble" aria-live="polite"></p>

    <div class="corner">
      <div id="ear" class="ear" role="img" aria-label="Estou ouvindo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 3.4-3.6 4.4-3.6 7.6a3 3 0 0 1-5.7 1.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M9.6 10a2.4 2.4 0 0 1 4.8 0c0 1.7-2.1 2.2-2.1 3.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <button id="mute" class="mute" type="button" aria-pressed="false" aria-label="Sons ligados">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
          <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path class="cross" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <p id="tap-hint" class="tap-hint" hidden>Toque na tela para eu ouvir</p>
    <p id="note" class="note" hidden></p>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
  </div>

  <nav id="cmds" class="cmds" aria-label="Comandos"></nav>
</main>

<!-- One tap starts the mic (iOS only grants it inside a tap). -->
<button id="start" class="start" type="button">
  <span class="start-cat">🔦🐱</span>
  <span class="start-title">Cadê o Gato?</span>
  <span class="start-go">▶ Toque para começar</span>
  <span class="start-adult">A casa está escura e o gato se escondeu. Depois é só falar: “acende a luz!”, “chama o gato!”, “abre a porta!”… O jogo escuta o tempo todo. Os botões embaixo também funcionam.</span>
</button>

<!-- The mic stopped and only a tap can restart it (iOS): an invisible button
     over the whole screen. Shown through `hidden`, so it never sits in the layout. -->
<button id="tap-resume" class="tap-resume" type="button" aria-label="Toque na tela para eu ouvir" hidden></button>

</body>
</html>
