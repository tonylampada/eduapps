<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFE9C7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Monstro">
  <title>Monstro Comilão</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FFE9C7'/%3E%3Cpath d='M32 10c17 0 26 13 26 30 0 15-10 20-26 20S6 55 6 40c0-17 9-30 26-30z' fill='%234FC1A6'/%3E%3Ccircle cx='24' cy='30' r='6' fill='%23fff'/%3E%3Ccircle cx='40' cy='30' r='6' fill='%23fff'/%3E%3Ccircle cx='25' cy='32' r='3' fill='%2322223B'/%3E%3Ccircle cx='41' cy='32' r='3' fill='%2322223B'/%3E%3Cellipse cx='32' cy='46' rx='9' ry='6' fill='%235A1F33'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./game.js"></script>
</head>
<body data-phase="start">

<a class="back" href="../../" aria-label="Voltar">←</a>

<main class="app">
  <div id="scene" class="scene">
    <div class="window" aria-hidden="true"></div>
    <div class="shelf" aria-hidden="true"></div>
    <div class="floor" aria-hidden="true"></div>

    <div id="dots" class="dots" aria-hidden="true"></div>

    <div id="monster" class="monster">
      <div class="mon-move"></div>
      <div class="qmark" aria-hidden="true">?</div>
      <div class="hearts" aria-hidden="true"><i>❤</i><i>❤</i><i>❤</i></div>
      <div class="sparkles" aria-hidden="true"><i>✦</i><i>★</i><i>✦</i><i>★</i></div>
      <div id="wish" class="wish" aria-hidden="true"><i class="puff p1"></i><i class="puff p2"></i><div class="wish-food"></div></div>
    </div>

    <p id="bubble" class="bubble" aria-live="polite"></p>

    <div class="corner">
      <div id="ear" class="ear" role="img" aria-label="Estou ouvindo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 3.4-3.6 4.4-3.6 7.6a3 3 0 0 1-5.7 1.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M9.6 10a2.4 2.4 0 0 1 4.8 0c0 1.7-2.1 2.2-2.1 3.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <button id="mute" class="mute" type="button" aria-pressed="false" aria-label="Sons ligados">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
          <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path class="cross" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <p id="tap-hint" class="tap-hint" hidden>Toque na tela para eu ouvir</p>
    <p id="note" class="note" hidden></p>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
  </div>

  <!-- The table: each plate is a command button ("dá a <food>"). -->
  <nav id="cmds" class="cmds" aria-label="Comidas"></nav>
</main>

<!-- One tap on a level starts the mic (iOS only grants it inside a tap). -->
<div id="start" class="start">
  <div class="start-mon"></div>
  <h1 class="start-title">Monstro Comilão</h1>
  <div class="levels">
    <button type="button" class="level" data-level="2">
      <span class="lv-food" data-food="banana"></span>
      <span class="lv-say">“dá a banana”</span>
      <span class="lv-go">▶ Comidas</span>
    </button>
    <button type="button" class="level" data-level="3">
      <span class="lv-food" data-food="maca"></span>
      <span class="lv-say">“dá a maçã vermelha”</span>
      <span class="lv-go">▶ Comidas e cores</span>
    </button>
  </div>
  <p class="start-adult">O monstro pensa numa comida. Fale para dar: “dá a banana”, “come o bolo”, “quero a uva”… O jogo escuta o tempo todo. Os pratos também funcionam com um toque.</p>
</div>

<!-- The mic stopped and only a tap can restart it (iOS): an invisible button
     over the whole screen. Shown through `hidden`, so it never sits in the layout. -->
<button id="tap-resume" class="tap-resume" type="button" aria-label="Toque na tela para eu ouvir" hidden></button>

</body>
</html>
