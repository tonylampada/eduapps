<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#BFE6FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cachorro">
  <title>Cachorro no Quintal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23BFE6FF'/%3E%3Ccircle cx='34' cy='32' r='16' fill='%23E0A562'/%3E%3Cpath d='M22 20q-8 4-5 18q8-1 9-14z' fill='%238B5A2B'/%3E%3Ccircle cx='38' cy='28' r='2.6' fill='%232B2B2B'/%3E%3Cellipse cx='46' cy='36' rx='7' ry='5' fill='%23F3D2A6'/%3E%3Ccircle cx='51' cy='34' r='3' fill='%232B2B2B'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./game.js"></script>
</head>
<body data-phase="start">

<a class="back" href="../../" aria-label="Voltar">←</a>

<main class="app">
  <div id="scene" class="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="ground"></div>

    <div id="world" class="world">
      <div class="fence-back"></div>
      <svg class="house" viewBox="0 0 100 90" aria-hidden="true">
        <path d="M8 40 50 6 92 40z" fill="#C8463C"/>
        <rect x="16" y="36" width="68" height="52" rx="3" fill="#F2C46D"/>
        <path d="M36 88V62a14 14 0 0 1 28 0v26z" fill="#5A3A22"/>
      </svg>
      <div id="slot-1" class="slot"></div>
      <div id="slot-2" class="slot"></div>
      <svg id="bone" class="bone" viewBox="0 0 80 32" aria-hidden="true">
        <path d="M14 6a7 7 0 0 1 8 6h36a7 7 0 1 1 8 8 7 7 0 1 1-8 8H22a7 7 0 1 1-8-8 7 7 0 1 1 0-14z" fill="#FFF8EA" stroke="#D9C9A8" stroke-width="2.5"/>
      </svg>

      <div id="dog" class="dog">
        <div class="dog-move">
          <svg class="dog-svg" viewBox="0 0 140 110" aria-hidden="true">
            <g class="tail"><path d="M32 54Q16 44 18 26" fill="none" stroke="#C98A4B" stroke-width="8" stroke-linecap="round"/></g>
            <g class="legs back"><rect class="leg a" x="34" y="64" width="11" height="30" rx="5.5"/><rect class="leg b" x="48" y="64" width="11" height="30" rx="5.5"/></g>
            <g class="legs front"><rect class="leg b" x="78" y="64" width="11" height="30" rx="5.5"/><rect class="leg a" x="91" y="64" width="11" height="30" rx="5.5"/></g>
            <ellipse cx="66" cy="62" rx="38" ry="21" fill="#E0A562"/>
            <ellipse cx="54" cy="55" rx="12" ry="8" fill="#C98A4B"/>
            <g class="mud"><circle cx="44" cy="72" r="6"/><circle cx="72" cy="76" r="5"/><circle cx="90" cy="68" r="4"/><circle cx="58" cy="66" r="3.5"/><ellipse cx="84" cy="92" rx="7" ry="3"/></g>
            <g class="head">
              <circle cx="100" cy="40" r="21" fill="#E0A562"/>
              <ellipse cx="117" cy="48" rx="13" ry="10" fill="#F3D2A6"/>
              <circle cx="128" cy="44" r="5" fill="#2B2B2B"/>
              <circle class="eye" cx="105" cy="33" r="3.8" fill="#2B2B2B"/>
              <circle cx="106.3" cy="31.8" r="1.2" fill="#fff"/>
              <path class="mouth" d="M114 55q5 4 10 0" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round"/>
              <path class="tongue" d="M116 56q3 10 7 0z" fill="#EF6F86"/>
              <path class="ear" d="M88 24Q76 28 80 54Q92 52 94 32z" fill="#8B5A2B"/>
              <g class="held-bone"><path d="M110 50a4 4 0 0 1 5 3h20a4 4 0 1 1 5 5 4 4 0 1 1-5 5h-20a4 4 0 1 1-5-5 4 4 0 1 1 0-8z" fill="#FFF8EA" stroke="#D9C9A8" stroke-width="1.5"/></g>
              <g class="held-key"><circle cx="122" cy="56" r="5" fill="none" stroke="#E8B10E" stroke-width="3"/><path d="M127 56h12m-4 0v5m4-5v4" fill="none" stroke="#E8B10E" stroke-width="3" stroke-linecap="round"/></g>
            </g>
          </svg>
          <div class="au">AU AU!</div>
          <div class="zzz">z<span>z</span><span>z</span></div>
          <div class="stars-bonk">★ ✦ ★</div>
          <div class="drops"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
    </div>

    <p id="bubble" class="bubble" aria-live="polite"></p>

    <div class="corner">
      <div id="ear" class="ear" role="img" aria-label="Estou ouvindo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 3.4-3.6 4.4-3.6 7.6a3 3 0 0 1-5.7 1.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M9.6 10a2.4 2.4 0 0 1 4.8 0c0 1.7-2.1 2.2-2.1 3.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <button id="mute" class="mute" type="button" aria-pressed="false" aria-label="Sons ligados">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
          <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path class="cross" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <p id="tap-hint" class="tap-hint" hidden>Toque na tela para eu ouvir</p>
    <p id="note" class="note" hidden></p>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
  </div>

  <nav id="cmds" class="cmds" aria-label="Comandos"></nav>
</main>

<!-- One tap starts the mic (iOS only grants it inside a tap). -->
<button id="start" class="start" type="button">
  <span class="start-dog">🐶</span>
  <span class="start-title">Cachorro no Quintal</span>
  <span class="start-go">▶ Toque para começar</span>
  <span class="start-adult">Depois é só falar: “pula!”, “corre!”, “late!”… O jogo escuta o tempo todo. Os botões embaixo também funcionam.</span>
</button>

<!-- The mic stopped and only a tap can restart it (iOS): an invisible button
     over the whole screen. Shown through `hidden`, so it never sits in the layout. -->
<button id="tap-resume" class="tap-resume" type="button" aria-label="Toque na tela para eu ouvir" hidden></button>

</body>
</html>
